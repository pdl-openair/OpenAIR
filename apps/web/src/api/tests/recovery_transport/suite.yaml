suite_id: component.web.api.recovery-transport
protected_outcome: CAS revision, distinct current startup authority/request receipts, and recovery/event transport identity reach the authoritative API; failures remain failures.
authority_refs:
  - spec/testing/OpenAIR 测试设计合同.md
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
failure_class: recovery_transport_authority_violation
minimum_owner: 单个组件行为
production_targets:
  - apps/web/src/api/client.ts
  - apps/web/src/api/taskStartStatus.ts
test_responsibility: Real client functions with controlled HTTP Responses and chunked SSE; does not prove server storage.
execution_profiles: [deterministic]
required_dependencies: []
evidence_required: [vitest_result]
verdict_rule: PASS when real runtime assertions prove protected_outcome; FAIL on violation; missing runtime evidence is NO_VALID_EVIDENCE.
triggers: [recovery_or_persistence_changed]
