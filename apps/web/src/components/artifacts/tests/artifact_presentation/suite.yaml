suite_id: component.web.artifacts.canonical-presentation
protected_outcome: >-
  Canonical Artifact and Evidence content remains visible and traceable in the Web
  presentation without being replaced by an empty-state or legacy payload interpretation;
  all legal result JSON shapes retain answers, scope, uncertainty, next actions and
  ancillary evidence/limitations without resetting user reading state.
