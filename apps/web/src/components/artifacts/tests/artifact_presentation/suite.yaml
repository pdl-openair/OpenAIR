  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/科研资料与结构化/OpenAIR 研究资料整理规范.md
  - spec/testing/OpenAIR 测试设计合同.md
failure_class: canonical_artifact_content_source_or_unknown_fact_presentation_violation
