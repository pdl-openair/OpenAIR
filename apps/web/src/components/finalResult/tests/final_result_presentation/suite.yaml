  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 研究项目生命周期.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - schemas/cs_reproduction/specs/04-insight/cs-reproduction-conclusion-recommendation-v4.md
  - schemas/opentrajectory/specs/04-insight/current-research-conclusion.md
  - schemas/opentrajectory/specs/04-insight/key-unknowns-candidate-explanations.md
  - schemas/opentrajectory/specs/04-insight/next-research-recommendation.md
  - schemas/pvd/specs/04-insight/round-experiment-plan-parameter-recommendation.md
  - spec/testing/OpenAIR 测试设计合同.md
failure_class: node_product_presentation_or_public_identity_violation
