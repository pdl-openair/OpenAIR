suite_id: component.web.model.workbench-screen
protected_outcome: Workbench screen projection uses one authoritative task revision, preserves durable stage and WorkUnit facts, and does not invent stages, capabilities, completion, or retry state.
authority_refs:
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 研究项目生命周期.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - spec/testing/OpenAIR 测试设计合同.md
failure_class: workbench_screen_revision_stage_or_collaboration_projection_violation
minimum_owner: 单个组件行为
production_targets:
  - apps/web/src/api/client.ts
  - apps/web/src/model/workbenchTask.ts
  - apps/web/src/model/workbenchScreenCore.mjs
  - apps/web/src/components/workbench/WorkbenchInteractionPanel.tsx
  - apps/web/src/components/workbench/ResearchActivityStream.tsx
test_responsibility: deterministic component behavior for workbench screen projection and durable progress presentation
execution_profiles: [deterministic]
required_dependencies: []
evidence_required: [vitest_result]
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers: [workbench_screen_projection_changes]
