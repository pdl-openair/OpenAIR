# ===========================================================================
# OpenAIR Web — nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 1) 提供前端静态文件（SPA，react-router 客户端路由靠 try_files 回退）
# 2) 同源反代 /api/* → api:8000（同一 compose 网络内按服务名解析）
#
# 注意：
#   - /internal/* 不在此暴露（worker→API 的内部回调，仅容器内网可达）
#   - proxy_buffering off + 长 read_timeout：保证 agent chat 流式（NDJSON）逐块到达
# ===========================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # skills / 产物上传走 FormData，放宽请求体上限（与 OPENAIR_ARTIFACT_UPLOAD_MAX_BYTES 对齐）
    client_max_body_size 1000m;

    # gzip 压缩文本类响应（HTML/JS/CSS/JSON/SVG）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # 后端 API 反代（同源）
    # ------------------------------------------------------------------------
    # /health* 不在 /api 前缀下，但设置页/运维探测需要同源可达
    location /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;   # 不带末尾斜杠/路径 → 保留 /api 前缀透传给后端
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 流式必需：关闭缓冲，并放宽超时到与 worker 执行超时一致（600s）
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ------------------------------------------------------------------------
    # 静态资源
    # ------------------------------------------------------------------------
    # 哈希文件名资源 → 长缓存、不可变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：任意前端路由刷新都返回 index.html（交给 react-router 处理）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
