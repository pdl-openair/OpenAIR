# OpenAIR mypy configuration: default (non-strict) strictness.
# The mypy gate is scoped by spec/enforcement/mypy-scope.txt (ratchet: the
# exemption list may only shrink). Used by scripts/gates/mypy_gate.py and by
# full-repo runs.

[mypy]
ignore_missing_imports = True
python_version = 3.12
exclude = (?x)(
      ^\.venv/
    | ^node_modules/
    | ^dist/
    | ^__pycache__/
    | ^\.claude/
    | ^\.cursor/
    | ^\.trae/
    | ^\.qoder/
    | ^personal/
    | ^\.git/
  )
