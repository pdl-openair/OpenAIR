suite_id: verification.research-continuity
protected_outcome: >-
  Pure research preserves incomplete source material and finishes an honest round;
  failed or unknown actions cannot become successful goal evidence. Internal pending
  outcomes retain their original owner and do not create a final result.
authority_refs:
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行资源使用与核验设计.md
failure_class:
  - scientific_content_blocks_research_delivery
  - failed_action_becomes_goal_evidence
  - unresolved_goal_is_reported_complete
minimum_owner: 跨组件与基础设施
production_targets:
  - services/api/app/execution/research_input_contract_gate.py
  - services/api/app/execution/research_dispatch_worker.py
  - services/api/app/modules/research_round_end.py
  - services/api/app/modules/target_output_evidence.py
  - services/api/app/modules/research_completion_decision.py
test_responsibility: >-
  Exercise canonical composition, dispatch, finalization and public GET using explicit
  software substitutes. These tests do not prove real SQL, Worker action or UI acceptance.
execution_profiles:
  - deterministic
required_dependencies:
  - project_python_dependencies
evidence_required:
  - pytest_exit_code_0
  - real_action_parameter_refusal_and_valid_control
  - original_goal_and_unknown_preservation
  - honest_round_end_and_public_readback
verdict_rule: >-
  PASS requires every software assertion. Missing dependencies give NO_VALID_EVIDENCE.
  Real PostgreSQL and original CS recovery remain separate acceptance requirements.
triggers:
  - research input composition or round completion changes
  - target evidence scope or worker pending outcome changes
