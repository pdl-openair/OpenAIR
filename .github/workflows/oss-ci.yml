# OpenAIR 公开仓精简 CI（源头：私有仓 scripts/oss/overlays，公开仓侧勿手改）
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm 版本读 package.json 的 packageManager（pnpm@9.15.0）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openair/web build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直跑 gitleaks 二进制（MIT，无 org 许可限制）：与私有仓导出门禁完全同构
      # （同版本 8.24.3、同一份 .gitleaks.toml 规则级白名单）。
      - name: Install gitleaks 8.24.3
        run: >-
          curl -sSL
          https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --redact -v

  # python lint 棘轮与后端测试随 v0.2 引入：当前代码基线含历史违规，
  # 私有仓以增量门禁（diff_gate --ruff）管理，公开仓待建立同等棘轮后再启用。
  #
  # TODO(v0.2)：打 tag 时构建并推送镜像到 ghcr.io，Release 附 docker-compose 拉取版与复现脚本。
