# tag 触发的发布流水线：多架构镜像、CLI 包、校验和、Release Notes、干净 Ubuntu 冒烟。
# 含 "-" 的 tag（如 v0.3.0-rc.1）按预发布处理：Release 标记 prerelease，镜像不写 latest。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  cli:
    name: cli-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade build
      - name: Build CLI wheel and sdist
        run: python -m build --outdir dist ./cli
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: dist/

  images:
    name: image-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openair-api
            dockerfile: services/api/Dockerfile
          - image: openair-web
            dockerfile: apps/web/Dockerfile
          - image: openair-worker
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          tags="ghcr.io/${namespace}/${IMAGE}:${REF_NAME}"
          if [[ "$REF_NAME" != *-* ]]; then
            tags+=$'\n'"ghcr.io/${namespace}/${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Record digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s\n' "$IMAGE" "$DIGEST" > "digests/${IMAGE}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/

  release:
    name: release-assets
    needs: [cli, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/* digests/* docker-compose.yml .env.example

  smoke:
    name: clean-ubuntu-smoke
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: dist
      - name: Install released CLI wheel
        run: python -m pip install dist/openair_cli-*.whl
      - name: openair up on a clean Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          openair up --dir . --mode replay --yes --no-open \
            --admin-email admin@example.com --admin-password openair-smoke-pass
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Cleanup
        if: always()
        run: openair down --volumes || true
