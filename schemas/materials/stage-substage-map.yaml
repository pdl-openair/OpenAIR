problem_modeling:
  label: 问题建模
  description: Define the research question, boundary, constraints, and success criteria.
  substages:
  - key: database_search
    label: 数据库候选检索
    description: 把多目标性能约束（带隙、形成能、ehull、元素限制等）翻译为对真实材料数据库的查询，检索满足约束的已有候选并整理为下游演化的种子清单。
  - key: literature_review
    label: 文献调研与研究目标
    description: 明确材料研究目标，检索并汇总相关文献与材料家族背景，为目标阈值设定和后续方案设计提供依据，产出研究目标说明与文献背景综述。
solution_design:
  label: 方案设计
  description: Design the research method, data strategy, analysis plan, and executable
    tasks.
  substages:
  - key: candidate_generation
    label: 候选生成
    description: 把性能目标、约束与数据库种子提交给生成式演化流水线（扩散变异 + 多目标进化搜索），跟踪演化过程并在必要时干预，输出 Pareto
      前沿的新候选晶体。
  - key: parameter_recommendation
    label: 参数推荐
    description: 把目标候选与实验室约束翻译为可执行的制备/合成参数方案，给出基线配方与替代方案，产出参数推荐表。
  - key: synthesis_assessment
    label: 可制备性评估
    description: 评估候选材料的可制备性：制备路线先例、竞争相与分相风险、元素挥发与毒性、适合的制备方法与设备可行性，产出可制备性评估报告。
execution_validation:
  label: 执行验证
  description: Run execution or validation, extract evidence, analyze results, and
    check quality.
  substages:
  - key: band_gap_calculation
    label: DFT 带隙计算
    description: 把候选晶体结构（CIF）转为 VASP 计算输入并提交 DFT 带隙计算，回收结果给出带隙数值与直接/间接带隙性质判定，产出带隙计算报告。
  - key: stability_verification
    label: 热力学稳定性验证
    description: 对候选化合物执行 DFT 热力学稳定性验证：生成竞争相计算输入并提交 HPC 计算，构建凸包相图，给出 ehull 与形成能，判定候选是否值得进入下游制备。
  - key: synthesis_execution
    label: 合成执行（湿实验）
    description: 把候选材料、制备评估与推荐配方整理成实验人员可执行的指派单，回收实际制备记录与表征结果，对比预测、DFT 与实测三方数据。
  - key: candidate_discovery
    label: 候选发现
    description: 在目标与约束下检索并生成可追溯候选，保留零可行候选、部分失败与运行 lineage。
    enabled: false
insight_generation:
  label: 结果总结
  description: Summarize results, update hypotheses, and assemble traceable research
    outputs.
  substages:
  - key: characterization
    label: 物相表征
    description: 对合成实验产物做物相表征（XRD/PDF 谱图模型训练与推理），给出相定量、拟合度与置信度，必要时建议重训模型或补充负样本。
    enabled: false
  - key: report_generation
    label: 报告生成
    description: 汇总材料发现全流程的真实证据（数据库检索、候选演化、计算验证），生成结构完整、数字可溯源、缺失步骤明确标注的分析报告与图表。
