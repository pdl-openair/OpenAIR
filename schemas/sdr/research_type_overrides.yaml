# research_type_overrides.yaml
# Required and optional substages per research type (M/D/C/H).
# M=Method, D=Discovery, C=Computational tool, H=Hybrid

M:
  label: 方法研究
  required_substages:
    - intent_understanding
    - literature_search
    - gap_identification
    - question_refinement
    - hypothesis_formation
    - topic_briefing
    - method_selection
    - variable_definition
    - data_strategy
    - analysis_planning
    - baseline_selection
    - ablation_design
    - task_breakdown
    - reproducibility
    - exploratory_execution
    - full_execution
    - statistical_analysis
    - hypothesis_validation
    - findings_synthesis
    - argument_blueprint
    - report_generation
  optional_substages:
    - constraints_criteria
    - negative_result_recording
    - mechanism_explanation
    - result_acceptance
    - research_lead_generation
    - hypothesis_update

