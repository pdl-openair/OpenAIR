suite_id: component.skill.pvd.parameter-experiment-plan-feasibility-validation
protected_outcome: >-
  PVD feasibility finalization preserves upstream candidate direction identity
  without rewriting scientific choices; missing or invalid model judgments fail
  rather than being repaired into scientific conclusions, while the explicit
  runtime-unavailable helper remains a separate degraded-result path.
authority_refs:
  - docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
  - docs/02_产品与Workflow/PVD/PVD Skill 合同.md
  - docs/02_产品与Workflow/PVD/OpenAIR PVD Workflow 设计合同.md
  - skills/pvd/pvd-parameter-experiment-plan-feasibility-validation/skill.yaml
failure_class: pvd_feasibility_direction_identity_or_unavailable_gate_violation
minimum_owner: 单个组件行为
production_targets:
  - skills/pvd/pvd-parameter-experiment-plan-feasibility-validation/scripts
test_responsibility: >-
  deterministic component proof that every legal scientific verdict is
  preserved, missing or malformed judgments fail without semantic repair, the
  finalized result passes the formal output schema, and the explicit
  runtime-unavailable helper remains separate from scientific invalidity
execution_profiles:
  - deterministic
required_dependencies: []
evidence_required:
  - pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all
  evidence_required items are obtained, and the existing Suite assertions prove
  protected_outcome; FAIL when sufficient valid evidence proves protected_outcome
  is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
  - Skill implementation changes
  - Skill input/output or finalization contract changes
