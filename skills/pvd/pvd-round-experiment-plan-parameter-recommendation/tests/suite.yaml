suite_id: component.skills.pvd-round-parameter-recommendation-contracts
protected_outcome: PVD round experiment plan parameter recommendation reports zero-accepted states as not-applicable rather than a recommendation, keeps a single accepted run without a first run pending instead of ranked, ranks multi-candidate accepted subsets, removes invalid first-run ids with a visible reason, and isolates out-of-bounds recipes from valid ones.
authority_refs:
- docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
- spec/testing/OpenAIR 测试设计合同.md
- spec/testing/OpenAIR 测试代码架构.md
failure_class:
- pvd_parameter_recommendation_contract_regression
minimum_owner: 单个组件行为
production_targets:
- skills/pvd/pvd-round-experiment-plan-parameter-recommendation/
test_responsibility: Deterministically pin applicability, pending-vs-ranked state, ranking, invalid-input removal, and recipe isolation contracts.
execution_profiles:
- deterministic
required_dependencies:
- project_python_dependencies
evidence_required:
- pytest_exit_code_0
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all
  evidence_required items are obtained, and the existing Suite assertions
  prove protected_outcome; FAIL when sufficient valid evidence proves
  protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
- pvd_parameter_recommendation_changed
