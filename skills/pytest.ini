[pytest]
testpaths = skills
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: minimal happy-path tests that lock documented behavior
    regression: audit-driven regression tests (snapshot or xfail, see docstring)
    contract: contract tests asserting SKILL.md/skill.yaml documented I/O schema
addopts = --strict-markers --no-header --import-mode=importlib
norecursedirs = scripts references resources .venv node_modules
