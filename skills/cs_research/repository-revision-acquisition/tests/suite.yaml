suite_id: component.skills.repository-revision-acquisition-contracts
protected_outcome: Repository revision acquisition keeps a formal protocol and revision grammar, preserves stdout/stderr/returncode through run_git, keeps tag checkout and HEAD contracts on real local git success, preserves source evidence only when it matches repository identity, resolves remote branches unchanged, and rejects unresolvable revisions on accessible repositories.
authority_refs:
- docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
- spec/testing/OpenAIR 测试设计合同.md
- spec/testing/OpenAIR 测试代码架构.md
failure_class:
- repository_revision_acquisition_contract_regression
minimum_owner: 单个组件行为
production_targets:
- skills/cs_research/repository-revision-acquisition/
test_responsibility: Deterministically pin the acquisition adapter's protocol grammar, git wrapper, and revision evidence contracts, including real local git fixtures.
execution_profiles:
- deterministic
required_dependencies:
- project_python_dependencies
evidence_required:
- pytest_exit_code_0
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all
  evidence_required items are obtained, and the existing Suite assertions
  prove protected_outcome; FAIL when sufficient valid evidence proves
  protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
- repository_revision_acquisition_changed
