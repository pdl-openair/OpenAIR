    drives the deterministic evolve_driver (bash) one generation at a time, and adaptively
    steers (ban elements, tighten constraints, raise mutation strength, flip crossover).
    Mutation = diffusion-mutate MCP (noise+denoise); crossover = same MCP two-parent
    blend; fitness = alignn-predict; relax = mattersim-relax; final novelty = mattergen-evaluate.
    Replaces the deprecated flux-evolution-mcp service.
