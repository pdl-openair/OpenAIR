suite_id: component.execution.provider-visible-skill-input
protected_outcome: >-
  Opted-in reasoning Skills receive a deterministic scientific-minimal payload
  containing only their declared model-visible input and instructions while
  canonical parameters and machine Schema remain outside the model message.
authority_refs:
  - docs/01_核心设计/科研资料与结构化/OpenAIR_科研判断与结构化输出设计合同.md
  - docs/01_核心设计/科研资料与结构化/OpenAIR_Schema基础设施与交接检查规范.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
  - skills/opentrajectory/problem-framing-generation/skill.yaml
  - skills/opentrajectory/retrieval-matrix-generation/skill.yaml
  - skills/opentrajectory/evidence-schema-design-skill/skill.yaml
failure_class:
  - scientific_minimal_contract_is_not_selected
  - provider_visible_input_loses_declared_scientific_fields
  - execution_identity_or_expanded_queries_leak_to_provider
  - provider_visible_projection_mutates_canonical_input
  - scientific_minimal_payload_restores_retired_envelope_fields
  - scientific_minimal_payload_exposes_machine_schema
minimum_owner: 单个组件行为
production_targets:
  - services/api/app/execution/provider_visible_skill_input.py
test_responsibility: >-
  Deterministically prove the public Provider-visible input projection and
  scientific-minimal payload contract preserve declared scientific content,
  exclude non-model execution fields and retired envelope fields, and leave
  canonical input unchanged across supported research domains.
execution_profiles:
  - deterministic
required_dependencies:
  - project_python_dependencies
evidence_required:
  - pytest_exit_code_0
  - exact_scientific_minimal_payload_assertions
  - provider_visible_projection_assertions
  - canonical_input_preservation_assertion
verdict_rule: >-
  PASS only when all required evidence is obtained and the existing assertions
  prove opted-in Skills select the scientific-minimal contract, payloads contain
  only instructions and scientificInput, declared scientific
  content is preserved across domains, non-model fields are excluded, and
  canonical input remains unchanged; FAIL when valid evidence contradicts any
  boundary; otherwise NO_VALID_EVIDENCE.
triggers:
  - Provider-visible Skill input projection changes
  - scientific-minimal payload construction changes
  - opted-in provider message contract changes
