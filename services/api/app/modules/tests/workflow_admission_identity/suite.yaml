suite_id: component.modules.workflow-admission-identity
protected_outcome: Workflow admission preserves the frozen Workflow identity supplied by the canonical Workflow source without rewriting its content-hash identity.
authority_refs:
- docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
- spec/testing/OpenAIR 测试设计合同.md
- spec/testing/OpenAIR 测试代码架构.md
failure_class: workflow_admission_frozen_identity_rewrite_violation
minimum_owner: 单个组件行为
production_targets:
- services/api/app/modules/workflow_planning.py
test_responsibility: deterministic component proof that Workflow admission carries the frozen canonical Workflow identity through unchanged
execution_profiles:
- deterministic
required_dependencies: []
evidence_required:
- pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
- Workflow admission projection changes
- frozen Workflow identity or provenance contract changes
