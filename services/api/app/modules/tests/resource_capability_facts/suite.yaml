suite_id: component.modules.resource-capability-facts
protected_outcome: Catalog-facing runtime capability facts fail closed on a transient Registry snapshot read failure without caching the failure as permanent unavailability, so a later healthy read can recover automatically.
authority_refs:
  - docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
  - schemas/resources/catalog-release.schema.json
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: catalog_runtime_fact_transient_registry_failure_poisoning
minimum_owner: 单个组件行为
production_targets:
  - services/api/app/modules/resource_capability_facts.py
test_responsibility: deterministic component proof that transient Registry read failures fail closed for the current projection and are retried on the next read instead of poisoning the process-wide bindability cache
execution_profiles:
  - deterministic
required_dependencies: []
evidence_required:
  - pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
  - Catalog runtime capability projection caching changes
  - Registry snapshot read failure handling changes
