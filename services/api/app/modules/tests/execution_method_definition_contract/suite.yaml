suite_id: component.modules.execution-method-definition-contract
protected_outcome: "Definition-declared Execution Methods remain valid role/control graphs: roles declare capability kinds and dependencies without embedding concrete Agent, Skill, or model identity, and the dependency graph is structurally executable."
authority_refs:
  - docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - spec/testing/OpenAIR 测试架构.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: execution_method_definition_contract_violation
minimum_owner: 确定性合同与不变量
production_targets:
  - services/api/app/modules/registry_snapshot_repository.py
test_responsibility: deterministic component proof that the Definition parser accepts a valid role-only Execution Method and rejects concrete capability/model identity or cyclic role dependencies
execution_profiles:
  - deterministic
required_dependencies: []
evidence_required:
  - pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
  - Execution Method schema or parser changes
  - Execution Method role identity or dependency semantics changes
  - Definition spec parsing changes
