suite_id: component.modules.production-workflow-source
protected_outcome: Production Workflow loading, validation, freezing, dependency structure, external-action boundaries, and Definition identity checks preserve the formal Workflow contract and immutable provenance without consulting planning or execution state as substitute authority.
authority_refs:
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 研究项目生命周期.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: production_workflow_source_schema_identity_dependency_or_boundary_violation
minimum_owner: 单个组件行为
production_targets:
  - services/api/app/modules/production_workflow_source.py
test_responsibility: deterministic component proof that formal Workflow files load fail-closed, bind exact Definition identities and Registry snapshots, preserve immutable frozen provenance, and enforce structural and external-action boundaries
execution_profiles:
  - deterministic
required_dependencies:
  - repository Workflow definitions
  - Definition authority fixtures
evidence_required:
  - pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
  - ProductionWorkflowSource parsing or freeze changes
  - Workflow schema, dependency, boundary, or identity validation changes
  - frozen Workflow provenance changes
