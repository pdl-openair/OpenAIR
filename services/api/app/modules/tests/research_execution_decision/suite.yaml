suite_id: component.modules.research-execution-decision
protected_outcome: Execution selection requests are idempotent and payload-fenced, losing CAS attempts leave no materialization, committed selection advances fairness exactly once, and restart resumes from durable selection state.
authority_refs:
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: research_execution_decision_idempotency_fairness_or_atomicity_violation
minimum_owner: 单个组件行为
production_targets: [services/api/app/modules/research_execution_decision_service.py]
test_responsibility: component proof of durable execution-decision selection and first-dispatch transaction semantics
execution_profiles: [postgres]
required_dependencies: [isolated PostgreSQL test database]
evidence_required: [pytest_result, database_identity, transaction_state]
verdict_rule: PASS only when real PostgreSQL assertions prove replay fencing, CAS rollback, exactly-once cursor advance, restart continuity, and scoped read recovery; FAIL on a valid violation; otherwise NO_VALID_EVIDENCE.
triggers: [execution decision selection changes, fairness cursor or dispatch transaction changes]
