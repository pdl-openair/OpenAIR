suite_id: component.modules.controller-command-repository
protected_outcome: Controller commands remain task-scoped, authorization-bound, ordered, revision-fenced, atomically applied once, and recoverable after an expired claim.
authority_refs:
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: controller_command_scope_exactly_once_or_recovery_violation
minimum_owner: 单个组件行为
production_targets: [services/api/app/modules/controller_command_repository.py]
test_responsibility: component-owned PostgreSQL proof of controller-command transaction and claim semantics
execution_profiles: [postgres]
required_dependencies: [isolated PostgreSQL test database]
evidence_required: [pytest_result, database_identity, transaction_state]
verdict_rule: PASS only when the real PostgreSQL assertions prove atomic application, fencing, isolation, ordering, concurrency, and expired-claim recovery; FAIL on a valid violation; otherwise NO_VALID_EVIDENCE.
triggers: [controller command persistence changes, command claim or revision fencing changes]
