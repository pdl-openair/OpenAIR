  - spec/testing/OpenAIR 测试代码架构.md
failure_class: research_design_compiler_evaluator_authority_substitution
minimum_owner: 确定性合同与不变量
production_targets:
  - services/api/app/modules/research_design_compiler.py
test_responsibility: deterministic component proof that the compiler preserves the explicit Definition evaluator authority when forming ResearchDesign acceptance criteria
execution_profiles:
  - deterministic
required_dependencies: []
