suite_id: component.modules.capability-resolver
protected_outcome: Capability resolution selects only registered eligible durable capabilities, preserves canonical substage
  eligibility, and blocks unsupported external needs before execution.
authority_refs:
- docs/01_核心设计/研究执行与能力/OpenAIR Agent 与 Skill 能力体系.md
- docs/01_核心设计/研究执行与能力/OpenAIR 研究执行机制.md
- spec/testing/OpenAIR 测试设计合同.md
- spec/testing/OpenAIR 测试代码架构.md
failure_class: capability_resolution_registration_or_eligibility_violation
minimum_owner: 单个组件行为
production_targets:
- services/api/app/modules/capability_resolver.py
test_responsibility: deterministic component behavior for the protected production responsibility
execution_profiles:
- deterministic
required_dependencies: []
evidence_required:
- pytest_result
verdict_rule: >-
  PASS only when the declared execution conditions are satisfied, all evidence_required items are obtained, and the existing Suite assertions prove protected_outcome; FAIL when sufficient valid evidence proves protected_outcome is violated; otherwise the run is NO_VALID_EVIDENCE.
triggers:
- app.modules.capability_resolver behavior or contract changes
