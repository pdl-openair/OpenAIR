suite_id: component.modules.research-package-asset
protected_outcome: A Research Package artifact round-trips with stable project and design identity while immutable version fences reject conflicting replacement.
authority_refs:
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 核心对象与数据模型.md
  - docs/01_核心设计/研究生命周期与对象/OpenAIR 研究项目生命周期.md
  - spec/testing/OpenAIR 测试设计合同.md
  - spec/testing/OpenAIR 测试代码架构.md
failure_class: research_package_asset_identity_or_immutable_version_violation
minimum_owner: 单个组件行为
production_targets: [services/api/app/modules/research_package_asset.py]
test_responsibility: component-owned PostgreSQL proof of Research Package artifact persistence and immutable version fencing
execution_profiles: [postgres]
required_dependencies: [isolated PostgreSQL test database]
evidence_required: [pytest_result, database_identity, persisted_package_identity]
verdict_rule: PASS only when the real PostgreSQL round-trip preserves the package identity and the conflicting immutable version is rejected; FAIL on a valid violation; otherwise NO_VALID_EVIDENCE.
triggers: [research package persistence changes, research package version identity changes]
