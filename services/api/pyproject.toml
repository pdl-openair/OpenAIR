[project]
name = "openair-api"
version = "0.1.0"
description = "OpenAIR FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "httpx>=0.27.0,<1",
    "claude-agent-sdk>=0.1.81,<1",
    "anthropic>=1.13.0,<2",
    "psycopg[binary]>=3.2.0,<4",
    "python-jose[cryptography]>=3.3.0,<4",
    "bcrypt>=4.0.0,<5",
    "captcha>=0.6,<1",
    "python-multipart>=0.0.9,<1",
    "email-validator>=2.0.0,<3",
    "minio>=7.2.0,<8",
    "docker>=7.0.0,<8",
    "deepxiv-sdk==0.3.1",
    "python-dotenv>=1.0.0,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.0,<5",
    "rfc3339-validator>=0.1.4,<1",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<1.9",
    "PyMuPDF>=1.24.0,<2",
    "beautifulsoup4>=4.12.0,<5",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    # Shared LLM transport + token usage (packages/llm_core). Required at import time.
    "llm-core",
    "mp-api>=0.46.4,<1",
    "huggingface-hub>=1.26,<2",
]

[tool.uv.sources]
llm-core = { path = "../../packages/llm_core", editable = true }

# Static-gate toolchain (campaign 2026-09-ai4se-harness, batch B1). Frozen
# tool versions live in the campaign design; floors here match the validated
# local venv (ruff 0.16.8 / mypy 2.3.1 / pytest-cov 7.1.0).
[dependency-groups]
dev = [
    "ruff>=0.16.8,<1",
    "mypy>=2.3.1,<3",
    "pytest-cov>=7.1.0,<8",
]
